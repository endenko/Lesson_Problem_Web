<!DOCTYPE html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeMaster OJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Bật chế độ dark mode bằng class
        theme: {
          extend: {
            colors: {
              'oj-blue': '#002b5c', // Deep blue from the screenshot
              'oj-header': '#f8f9fa',
              'oj-text': '#333333',
              // Dark mode palette (Slate/Blueish Dark)
              'dark-bg': '#0f172a',    // Slate 900
              'dark-card': '#1e293b',  // Slate 800
              'dark-border': '#334155',// Slate 700
              'dark-text': '#e2e8f0',  // Slate 200
              'dark-text-muted': '#94a3b8', // Slate 400
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom Scrollbar for Dark Mode */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#f4f6f9] dark:bg-dark-bg text-[#333] dark:text-dark-text">

</body>
</html>
